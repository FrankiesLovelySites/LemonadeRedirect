<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We've Moved!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 {
            color: #2d3436;
            margin-bottom: 1rem;
        }
        p {
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .countdown-circle {
            font-size: 3rem;
            font-weight: bold;
            color: #0984e3;
            margin: 20px 0;
        }
        .link-manual {
            display: inline-block;
            margin-top: 15px;
            color: #636e72;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px solid #b2bec3;
        }
        .link-manual:hover {
            color: #0984e3;
            border-color: #0984e3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>We've Moved!</h1>
        <p>Our website has found a new home. You are being redirected to our new domain automatically. (lemonade-co.site)</p>
        
        <div class="countdown-circle" id="countdown">5</div>
        
        <p>Redirecting in <span id="text-timer">7</span> seconds...</p>
        
        <a href="https://www.lemonade-co.site" class="link-manual">Click here if you aren't redirected automatically</a>
    </div>

    <script>
        // Configuration: Set your new URL here
        const newDestination = "https://www.new-domain.com";
        let secondsLeft = 5;

        const countdownDisplay = document.getElementById('countdown');
        const textTimer = document.getElementById('text-timer');

        const timer = setInterval(() => {
            secondsLeft--;
            
            // Update the UI
            countdownDisplay.textContent = secondsLeft;
            textTimer.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(timer);
                window.location.href = newDestination;
            }
        }, 1000);
    </script>

</body>
</html>
